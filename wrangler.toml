# Cloudflare Pages configuration.
#
# The SNAPSHOTS binding below points at the production "bocodds-snapshots" KV
# namespace; Pages applies it on deploy. Local dev never touches it — wrangler
# simulates KV locally (npm run dev / the e2e suite).
name = "bocodds"
compatibility_date = "2026-07-01"
pages_build_output_dir = "public"

[vars]
# Scraping bankofcanadaodds.com stays off in production until permission is
# confirmed (see README). Override locally in .dev.vars.
ENABLE_BOCODDS = "false"
CONTACT_EMAIL = "patricksissons@gmail.com"

[[kv_namespaces]]
binding = "SNAPSHOTS"
id = "ea6ee33150c8493895dc3fd7fadfd63e" # bocodds-snapshots

